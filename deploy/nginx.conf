# Production web server: serves the static page and forwards /api/ to the FastAPI container.
# Caddy in front terminates TLS, so this file only speaks plain HTTP inside the Docker network.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Docker's embedded DNS. Using a variable makes nginx resolve "api" on each request, so a restarted
  # API container is found again without restarting nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;          # bulk upload: several 10 MB photos per request

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
      set $api_upstream http://api:8000;
      proxy_pass $api_upstream$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;         # retraining requests can be slow to answer
    }

    location / {
      try_files $uri /index.html;
    }
  }
}
