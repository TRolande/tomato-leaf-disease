events {}
http {
  upstream api { server api:8000; }     # Docker DNS returns every api container, nginx round-robins between them
  server {
    listen 80;
    client_max_body_size 20m;
    location / {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_read_timeout 300s;
    }
  }
}
